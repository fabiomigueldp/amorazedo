<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#231920">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amor Azedo 2">
  <meta name="description" content="Amor Azedo 2: Fake It Till You Break It. Uma visual novel em português.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="app.css">
  <title>Amor Azedo 2</title>
</head>
<body>
  <main id="viewport">
    <iframe id="game" title="Amor Azedo 2" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <aside id="portrait-hint" hidden>Para ler melhor, vire o celular na horizontal.<button id="dismiss-hint" aria-label="Fechar orientação">×</button></aside>
    <aside id="install-guide" aria-labelledby="install-title" hidden>
      <div class="install-heading"><img src="icons/icon-192x192.png" alt="" width="40" height="40"><h2 id="install-title">Instalar no celular</h2><button id="dismiss-install" aria-label="Fechar dica de instalação">×</button></div>
      <p id="install-description">Abra o jogo pelo ícone na tela de início.</p>
      <ol id="install-steps" hidden></ol>
      <p id="install-note" hidden></p>
      <div class="install-actions"><button id="install-action">Ver passos</button><button id="copy-install-link" hidden>Copiar link</button><button id="install-later">Agora não</button></div>
      <p id="install-feedback" role="status" hidden></p>
    </aside>
    <details id="app-menu">
      <summary aria-label="Opções do aplicativo">•••</summary>
      <section>
        <h1>Amor Azedo 2</h1>
        <button id="install" hidden>Instalar no celular</button>
        <button id="offline">Baixar para jogar offline</button>
        <button id="cancel-download" hidden>Cancelar download</button>
        <progress id="download-progress" hidden></progress>
        <p id="app-status" role="status" aria-live="polite"></p>
        <p>Salve pelo menu do jogo. Para fazer backup, use Exportar saves no menu ☰.</p>
        <button id="close-menu">Voltar ao jogo</button>
      </section>
    </details>
    <div id="boot" role="status"><img src="icons/icon-192x192.png" alt=""><p>Abrindo Amor Azedo 2…</p></div>
  </main>
  <noscript>Ative o JavaScript para jogar Amor Azedo 2.</noscript>
  <script src="app.js"></script>
</body>
</html>
